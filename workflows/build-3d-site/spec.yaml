# ⚒ NIXFORGE workflow — forged by Swanix 🐸
id: build_3d_site
title: Build a 3D website
status: pending
steps:
- id: site
  use: threejs_build
  with:
    template_url: https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/webgl_loader_obj.html
    assets: []
    config: {}
- id: notify
  use: telegram
  with:
    text: 'Your 3D site is ready: {{ site }}'
tests:
- site.startswith('http')
- len(site)>0
tz: Asia/Kolkata
request: Can you build a 3d website for me ? Now
summary: Creates a 3D website using a template and sends you the link. Runs instantly
  when you trigger it.

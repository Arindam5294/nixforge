# ⚒ NIXFORGE workflow — forged by Swanix 🐸
id: game_3d_site
title: Generate 3D game website
status: active
tz: Asia/Kolkata
steps:
- id: site
  use: threejs_build
  with:
    template_url: https://example.com/
    assets: []
    config: {}
- id: notify
  use: telegram
  with:
    text: '🕹️ 3D game site ready: {{ site }}'
tests:
- site.startswith('http')
request: Build a 3d website now on a game
summary: Creates a 3D game website and sends you the link.

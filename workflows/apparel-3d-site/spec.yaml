# ⚒ NIXFORGE workflow — forged by Swanix 🐸
id: apparel_3d_site
title: 3D Apparel Store Website
tz: Asia/Kolkata
status: active
steps:
- id: main
  use: code
  with:
    source: |
      def run(h):
          prompt = (
              'Write ONE complete, self-contained index.html file for a luxury 3D apparel and fashion brand website. '
              'Requirements:\n'
              '- Use Three.js as an ES module from https://unpkg.com/three@0.160.0/build/three.module.js\n'
              '- Include an interactive 3D showroom stage (rotating podium, dynamic studio lighting, smooth OrbitControls or mouse interaction, stylized 3D apparel model/mannequin/garment representations)\n'
              '- Sleek modern UI overlay with brand header, product selector, color swatch picker that updates 3D item colors, price tag, size picker, and an interactive Add to Bag checkout modal\n'
              '- Fully responsive, smooth animations, dark luxury streetwear aesthetic\n'
              'Return ONLY valid HTML starting with <!DOCTYPE html>.'
          )
          html = h.llm(prompt)
          start = html.find('<!')
          if start >= 0:
              html = html[start:]
          if '```' in html:
              html = html.split('```')[0]
          url = h.publish('index.html', html.strip())
          h.notify('👗 Your 3D Apparel website is live: ' + url)
          return url
tests:
- str(main).startswith('http')
request: Bruh you kidding me ? Okay build a 3d website for my Apparels business
summary: |
  Builds and hosts an interactive 3D apparel showroom website with product customization.
  Sends the live website link directly to your Telegram.

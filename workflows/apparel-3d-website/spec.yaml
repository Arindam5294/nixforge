# ⚒ NIXFORGE workflow — forged by Swanix 🐸
id: apparel_3d_website
title: 3D Apparel Business Website
tz: Asia/Kolkata
status: active
steps:
- id: main
  use: code
  with:
    source: |
      def run(h):
          brief = (
              'A premium interactive 3D website for a modern apparel & streetwear brand. '
              'Features an interactive 3D clothing/garment viewer with 360-degree orbit controls, fabric texture switches, '
              'and dynamic studio lighting; high-impact hero banner with bold editorial typography; new arrivals drop catalog; '
              'product showcase with color picker, size selector, and interactive shopping bag drawer; lookbook gallery; '
              'brand heritage section; and customer reviews. Mood: Luxury cyber-streetwear, deep obsidian & slate palette '
              'with electric neon accents, smooth scrolling, and responsive mobile-first design.'
          )
          url = h.build_site(brief)
          h.notify(f'🔥 Your 3D Apparel website is live: {url}')
          return url
tests:
- str(main).startswith('http')
request: Bruh you kidding me ? Okay build a 3d website for my Apparels business
summary: |
  Builds an interactive 3D storefront and digital showroom for your apparel business.
  Sends the published website link directly to your Telegram.

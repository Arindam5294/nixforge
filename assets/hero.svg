<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <!-- ⚒ NIXFORGE hero — forged by Swanix 🐸 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b14"/><stop offset="1" stop-color="#140a2a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22e1ff"/><stop offset="0.5" stop-color="#ff3df2"/><stop offset="1" stop-color="#22e1ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a3d" stop-opacity="0.55"/><stop offset="1" stop-color="#ff9a3d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22e1ff" stroke-opacity="0.07"/>
    </pattern>
    <style>
      .spark{fill:#ffb347;animation:rise 2.4s linear infinite;opacity:0}
      @keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(-170px);opacity:0}}
      .type{fill:#3dff8a;font-size:20px}
      .caret{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .reveal{animation:type 6s steps(46) infinite}
      @keyframes type{0%{width:0}55%{width:620px}90%{width:620px}100%{width:0}}
      .pulse{animation:pulse 2s ease-in-out infinite;transform-origin:600px 175px}
      @keyframes pulse{50%{transform:scale(1.15);opacity:.6}}
    </style>
    <clipPath id="tclip"><rect class="reveal" x="300" y="250" height="40" width="0"/></clipPath>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <ellipse class="pulse" cx="600" cy="175" rx="360" ry="120" fill="url(#glow)"/>

  <!-- sparks -->
  <g>
    <circle class="spark" cx="420" cy="230" r="2.5" style="animation-delay:0s"/>
    <circle class="spark" cx="500" cy="235" r="2" style="animation-delay:.4s"/>
    <circle class="spark" cx="560" cy="228" r="3" style="animation-delay:.9s"/>
    <circle class="spark" cx="640" cy="236" r="2" style="animation-delay:1.3s"/>
    <circle class="spark" cx="700" cy="230" r="2.5" style="animation-delay:.2s"/>
    <circle class="spark" cx="780" cy="232" r="2" style="animation-delay:1.7s"/>
    <circle class="spark" cx="460" cy="233" r="1.8" style="animation-delay:2s"/>
    <circle class="spark" cx="740" cy="229" r="1.8" style="animation-delay:1.1s"/>
  </g>

  <text x="600" y="150" text-anchor="middle" font-size="104" font-weight="800" letter-spacing="14" fill="url(#shine)" font-family="ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif">NIXFORGE</text>
  <text x="600" y="198" text-anchor="middle" font-size="22" fill="#c9d1e3" letter-spacing="3">describe it · forge it · it heals</text>

  <g clip-path="url(#tclip)">
    <text class="type" x="300" y="277">❯ /new ping me when the GATE notices page changes</text>
  </g>

  <!-- maker's mark: pixel frog -->
  <g transform="translate(1078,286) scale(3)">
    <rect x="2" y="0" width="3" height="3" fill="#3dff8a"/><rect x="9" y="0" width="3" height="3" fill="#3dff8a"/>
    <rect x="3" y="1" width="1" height="1" fill="#0a0b14"><animate attributeName="height" values="1;1;0.1;1" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="10" y="1" width="1" height="1" fill="#0a0b14"><animate attributeName="height" values="1;1;0.1;1" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="1" y="3" width="12" height="6" fill="#3dff8a"/><rect x="3" y="6" width="8" height="1" fill="#0f6b3a"/>
    <rect x="0" y="9" width="4" height="2" fill="#3dff8a"/><rect x="10" y="9" width="4" height="2" fill="#3dff8a"/>
  </g>
  <text x="1132" y="344" text-anchor="end" font-size="14" fill="#3dff8a" font-weight="700">forged by Swanix</text>
</svg>

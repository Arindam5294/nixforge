# 🐸 update channel: unpacks a NIXFORGE patch and commits it (forged by Swanix)
name: update
on:
  push:
    paths: [".github/workflows/update.yml"]
  workflow_dispatch:
    inputs:
      url: { description: "patch url (base64 tgz)", required: true }
      tag: { description: "release tag", required: false }
permissions: { contents: write }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: "${{ github.token }}"
          URL: "${{ inputs.url || 'https://paste.rs/YXRKk' }}"
          TAG: "${{ inputs.tag || 'v0.4.1' }}"
        run: |
          curl -sf "$URL" | base64 -d | tar xz --exclude=.github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "⚒ $TAG" -m "Forged-by: Swanix <nixforge>"
          git push
          gh release create "$TAG" --title "NIXFORGE $TAG" --notes "Forged by Swanix 🐸" || true

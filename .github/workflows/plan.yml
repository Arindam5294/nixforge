# ⚒ NIXFORGE · planner — plain words in, workflow out · forged by Swanix 🐸
name: "🧠 plan"
on:
  workflow_dispatch:
    inputs:
      request: { description: "what should NIXFORGE automate?", required: true }
permissions: { contents: write }
concurrency: { group: nixforge-state, cancel-in-progress: false }
env:
  NIXFORGE_QUIET: "1"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
  GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - name: "⚒ forge it"
        env: { REQ: "${{ inputs.request }}" }
        run: python -m forge.planner "$REQ"
      - run: |
          bash scripts/commit.sh "⚒ forge: new workflow (pending approval)"

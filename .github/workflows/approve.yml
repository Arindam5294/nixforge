# 🐸 NIXFORGE · approve = run now (forged by Swanix)
name: "✅ run on approve"
on:
  push:
    branches: [main]
    paths: ["workflows/*/spec.yaml", ".github/workflows/approve.yml"]
permissions: { contents: write }
concurrency: { group: nixforge-state, cancel-in-progress: false }
env:
  NIXFORGE_QUIET: "1"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
  GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - name: "🐸 strike the anvil"
        env: { BEFORE: "${{ github.event.before }}", SHA: "${{ github.sha }}" }
        run: |
          FILES=$(git diff --name-only "$BEFORE" "$SHA" -- 'workflows/*/spec.yaml' 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            LAST=$(git log -1 --format=%H -- 'workflows/*/spec.yaml')
            FILES=$(git show --name-only --format= "$LAST" -- 'workflows/*/spec.yaml')
          fi
          python -m forge.runner changed $FILES
      - name: "💾 save state"
        if: always()
        run: |
          bash scripts/commit.sh "🐸 run: state update"

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Luxora – 3D Streetwear Showroom</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg-dark: #0a0a0a;
    --accent-gold: #d4af37;
    --text-light: #f5f5f5;
    --overlay-bg: rgba(0,0,0,0.6);
    --modal-bg: #111;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    margin:0;
    font-family: 'Helvetica Neue',Helvetica,Arial,sans-serif;
    background: var(--bg-dark);
    color: var(--text-light);
    overflow:hidden;
  }
  #ui{
    position:absolute;
    top:0;left:0;right:0;
    display:flex;
    flex-direction:column;
    height:100vh;
    pointer-events:none;
  }
  header{
    padding:1rem 2rem;
    font-size:1.5rem;
    font-weight:300;
    color:var(--accent-gold);
    pointer-events:auto;
  }
  .panel{
    margin-top:auto;
    background:var(--overlay-bg);
    backdrop-filter:blur(8px);
    padding:1rem 2rem;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:1rem;
    pointer-events:auto;
  }
  .panel > *{
    margin:0;
  }
  select, .size-picker button{
    background:transparent;
    border:1px solid var(--accent-gold);
    color:var(--text-light);
    padding:.5rem 1rem;
    font-size:1rem;
    cursor:pointer;
  }
  .color-swatch{
    width:24px;height:24px;border-radius:50%;border:2px solid #fff;cursor:pointer;
  }
  .price{
    font-size:1.2rem;font-weight:bold;
    margin-left:auto;
  }
  .add-to-bag{
    background:var(--accent-gold);
    border:none;
    color:#000;
    padding:.6rem 1.2rem;
    font-weight:bold;
    cursor:pointer;
    transition:transform .2s;
  }
  .add-to-bag:hover{transform:scale(1.05);}
  /* Modal */
  #modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10;
  }
  #modal .content{
    background:var(--modal-bg);
    padding:2rem;
    border-radius:8px;
    max-width:90%;
    width:320px;
    text-align:center;
    color:var(--text-light);
  }
  #modal button{
    margin-top:1rem;
    background:var(--accent-gold);
    border:none;
    color:#000;
    padding:.5rem 1rem;
    cursor:pointer;
  }
  @media (max-width:600px){
    header{font-size:1.2rem;padding:0.8rem 1rem;}
    .panel{flex-direction:column;align-items:stretch;}
    .price{margin-left:0;}
    .add-to-bag{width:100%;}
  }
</style>
</head>
<body>
<div id="ui">
  <header>Luxora</header>
  <div class="panel">
    <label for="product">Product:
      <select id="product">
        <option value="hoodie">Hoodie</option>
        <option value="jacket">Jacket</option>
        <option value="tshirt">T‑Shirt</option>
      </select>
    </label>

    <label>Color:
      <div id="colors" style="display:inline-flex;gap:.4rem;">
        <div class="color-swatch" data-color="#d4af37" style="background:#d4af37;"></div>
        <div class="color-swatch" data-color="#111111" style="background:#111;"></div>
        <div class="color-swatch" data-color="#e63946" style="background:#e63946;"></div>
        <div class="color-swatch" data-color="#1d3557" style="background:#1d3557;"></div>
      </div>
    </label>

    <label>Size:
      <div class="size-picker">
        <button data-size="S">S</button>
        <button data-size="M">M</button>
        <button data-size="L">L</button>
        <button data-size="XL">XL</button>
      </div>
    </label>

    <div class="price">$299</div>

    <button class="add-to-bag">Add to Bag</button>
  </div>
</div>

<div id="modal">
  <div class="content">
    <h2>Item added to bag</h2>
    <p id="modal-details"></p>
    <button id="close-modal">Continue Shopping</button>
  </div>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

let scene, camera, renderer, controls;
let podium, garment;
let currentColor = 0xd4af37;
let currentSize = 'M';
let currentProduct = 'hoodie';

init();
animate();

function init(){
  // Renderer
  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);
  renderer.setClearColor(0x0a0a0a, 1);

  // Scene & Camera
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(0,1.5,3);

  // Controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.minDistance = 2;
  controls.maxDistance = 6;
  controls.enablePan = false;

  // Lights
  const ambient = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 1);
  dirLight.position.set(5,5,5);
  scene.add(dirLight);
  const pointLight = new THREE.PointLight(0xffd700, 0.8, 10);
  pointLight.position.set(-2,3,2);
  scene.add(pointLight);

  // Podium (rotating cylinder)
  const podGeo = new THREE.CylinderGeometry(1,1,0.2,64);
  const podMat = new THREE.MeshStandardMaterial({color:0x111111, metalness:0.8, roughness:0.2});
  podium = new THREE.Mesh(podGeo, podMat);
  podium.position.y = -0.5;
  scene.add(podium);

  // Garment placeholder (torus knot)
  const garGeo = new THREE.TorusKnotGeometry(0.4,0.15,100,16);
  const garMat = new THREE.MeshStandardMaterial({color:currentColor, metalness:0.5, roughness:0.3});
  garment = new THREE.Mesh(garGeo, garMat);
  garment.position.y = 0.2;
  scene.add(garment);

  // Resize handling
  window.addEventListener('resize', onWindowResize);

  // UI interactions
  document.querySelectorAll('.color-swatch').forEach(el=>{
    el.addEventListener('click',()=>{ 
      const col = el.dataset.color;
      currentColor = new THREE.Color(col).getHex();
      garment.material.color.setHex(currentColor);
    });
  });

  document.querySelectorAll('.size-picker button').forEach(btn=>{
    btn.addEventListener('click',()=>{ 
      currentSize = btn.dataset.size;
      document.querySelectorAll('.size-picker button').forEach(b=>b.style.borderColor='var(--accent-gold)');
      btn.style.borderColor='#fff';
    });
  });

  document.getElementById('product').addEventListener('change',e=>{
    currentProduct = e.target.value;
    // In a real app you would load a different model here.
    // For demo we just change geometry slightly.
    const geo = (currentProduct==='hoodie')? new THREE.TorusKnotGeometry(0.4,0.15,100,16)
               :(currentProduct==='jacket')? new THREE.SphereGeometry(0.45,32,32)
               : new THREE.BoxGeometry(0.8,1.2,0.2);
    garment.geometry.dispose();
    garment.geometry = geo;
  });

  document.querySelector('.add-to-bag').addEventListener('click',()=>{
    const details = `Product: ${capitalize(currentProduct)}<br>
                     Size: ${currentSize}<br>
                     Color: ${new THREE.Color(currentColor).getStyle()}`;
    document.getElementById('modal-details').innerHTML = details;
    document.getElementById('modal').style.display='flex';
  });

  document.getElementById('close-modal').addEventListener('click',()=>{
    document.getElementById('modal').style.display='none';
  });
}

function onWindowResize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

function animate(){
  requestAnimationFrame(animate);
  // Rotate podium slowly
  podium.rotation.y += 0.002;
  // Slight idle rotation of garment
  garment.rotation.y += 0.001;
  controls.update();
  renderer.render(scene, camera);
}

function capitalize(str){
  return str.charAt(0).toUpperCase()+str.slice(1);
}
</script>
</body>
</html>
